name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: testing
      JWT_SECRET: 'Q7v!m2R#x9L@p4T$z8K&w1N*e6C^h3J%'
      DB_HOST: localhost
      DB_USER: bibliotech
      DB_NAME: bibliotech
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
