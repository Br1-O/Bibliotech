<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2ff">
    <script src="/js/theme.js"></script>
    <title>Bibliotech · Catalogo</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
    <div id="btPageLoader" class="bt-page-loader" role="status" aria-live="polite" aria-label="Cargando...">
        <span class="bt-page-loader__mark" aria-hidden="true">B</span>
        <span class="bt-page-loader__label">Bibliotech</span>
    </div>
    <bt-navbar active="catalog"></bt-navbar>

    <main class="bt-page">
        <section class="bt-hero bt-container">
            <h1 data-i18n="catalog.title">Catalogo global</h1>
            <p data-i18n="catalog.subtitle">Explora todo el material educativo publicado en la plataforma.</p>
        </section>

        <section id="catalogo" class="bt-container bt-stack bt-mt-6">
            <h2 data-i18n="catalog.materialsTitle">Material educativo</h2>
            <div class="bt-toolbar bt-row">
                <input id="catalogSearch" class="bt-input" type="search"
                       data-i18n-placeholder="catalog.searchPlaceholder" placeholder="Buscar...">
                <select id="catalogCareerFilter" class="bt-select"
                        data-i18n-title="catalog.filterByCareer" title="Carrera">
                    <option value="" data-i18n="careers.allCareers">Todas las carreras</option>
                </select>
                <select id="catalogYearFilter" class="bt-select"
                        data-i18n-title="catalog.filterByYear" title="Anio">
                    <option value="" data-i18n="careers.allYears">Todos los anios</option>
                </select>
                <select id="catalogSubjectFilter" class="bt-select"
                        data-i18n-title="catalog.filterBySubject" title="Materia">
                    <option value="" data-i18n="catalog.allSubjects">Todas las materias</option>
                </select>
                <select id="catalogTypeFilter" class="bt-select" data-i18n-title="catalog.filterByType" title="Tipo">
                    <option value="" data-i18n="filters.allTypes">Todos los tipos</option>
                </select>
                <input id="catalogTagFilter" class="bt-input" type="search"
                       data-i18n-placeholder="material.tagsPlaceholder"
                       data-i18n-title="catalog.filterByTag" placeholder="Etiquetas">
                <select id="catalogSort" class="bt-select" data-i18n-title="filters.sort" title="Ordenar por">
                    <option value="newest" data-i18n="filters.newest">Mas recientes</option>
                    <option value="oldest" data-i18n="filters.oldest">Mas antiguos</option>
                    <option value="title" data-i18n="filters.title">Titulo (A-Z)</option>
                </select>
                <button id="catalogClear" class="bt-btn bt-btn--ghost" type="button"
                        data-i18n="filters.clear">Limpiar filtros</button>
            </div>

            <p id="catalogResults" class="bt-text-muted"></p>
            <div id="materialsGrid" class="bt-grid"></div>
            <div id="catalogPagination"></div>
        </section>
    </main>

    <script src="/js/utils/dom.js"></script>
    <script src="/js/i18n/LanguageManager.js"></script>
    <script src="/js/utils/authHelper.js"></script>
    <script src="/js/utils/validator.js"></script>
    <script src="/js/components/icons.js"></script>
    <script src="/js/components/passwordField.js"></script>
    <script src="/js/components/button.js"></script>
    <script src="/js/components/loader.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/components/materialViewer.js"></script>
    <script src="/js/components/cards.js"></script>
    <script src="/js/components/materialEditor.js"></script>
    <script src="/js/components/tagInput.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/components/pagination.js"></script>
    <script src="/js/services/apiService.js"></script>
    <script src="/js/frontControllers/catalogFrontController.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
