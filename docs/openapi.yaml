openapi: 3.0.3
info:
  title: Bibliotech API Documentation
  version: 1.0.0
  description: >
    Contrato HTTP principal de Bibliotech. Los mensajes de negocio se traducen

    segun `Accept-Language`; los errores incluyen `message`, `code` y
    `requestId`.
servers:
  - url: http://localhost:3000
    description: Desarrollo local
  - url: https://bibliotech.example.com
    description: Despliegue de produccion
tags:
  - name: Auth
  - name: Materials
  - name: Moderation
  - name: Files
  - name: Careers
  - name: Subjects
  - name: Engagement
  - name: Streaks
  - name: Subscriptions
  - name: Notifications
  - name: Audit
  - name: ThematicTags
  - name: Health
  - name: Documentation
security:
  - bearerAuth: []
paths:
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Inicia sesion y emite el JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
            example:
              email: user@example.com
              password: Password123
      responses:
        "200":
          description: Sesion iniciada; tambien establece la cookie de archivos
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie HttpOnly usada por /file y /download
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - user
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
              example:
                message: string
                token: string
                user:
                  id: 1
                  nombre: string
                  apellido: string
                  email: user@example.com
                  rol: string
                  estado: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      operationId: postApiAuthLogin
  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Devuelve el usuario autenticado
      responses:
        "200":
          description: Usuario actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
              example:
                user:
                  id: 1
                  nombre: string
                  apellido: string
                  email: user@example.com
                  rol: string
                  estado: string
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: getApiAuthMe
  /api/materials/global:
    get:
      tags:
        - Materials
      summary: Catalogo global de materiales aprobados
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: q
          in: query
          schema:
            type: string
        - name: subjects
          in: query
          description: IDs separados por coma
          schema:
            type: string
        - name: tags
          in: query
          description: Etiquetas separadas por coma
          schema:
            type: string
        - name: tipo
          in: query
          schema:
            $ref: "#/components/schemas/MaterialType"
        - name: category
          in: query
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: careerId
          in: query
          schema:
            type: integer
        - name: yearId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Listado paginado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialPage"
              example:
                materials:
                  - id: 1
                    autorId: 1
                    uploadedBy: 1
                    author: string
                    categoryId: 1
                    titulo: string
                    tipo: PDF
                    urlOrPath: string
                    portada: string
                    fileHash: string
                    descripcion: string
                    pages: 1
                    categories:
                      - string
                    estado: Pendiente
                    hasStoredFile: true
                    materias:
                      - {}
                    materiasIds:
                      - 1
                    carreras:
                      - {}
                    createdAt: 2026-01-01T00:00:00.000Z
                pagination:
                  page: 1
                  pageSize: 1
                  total: 1
                  totalPages: 1
                  hasNext: true
                  hasPrev: true
        "400":
          $ref: "#/components/responses/BadRequest"
      operationId: getApiMaterialsGlobal
  /api/materials/filters:
    get:
      tags:
        - Materials
      summary: Opciones de filtro disponibles
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Anios y categorias
          content:
            application/json:
              schema:
                type: object
                properties:
                  years:
                    type: array
                    items:
                      type: integer
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        slug:
                          type: string
                        nombre:
                          type: string
              example:
                years:
                  - 1
                categories:
                  - id: 1
                    slug: string
                    nombre: string
      operationId: getApiMaterialsFilters
  /api/materials/mine:
    get:
      tags:
        - Materials
      summary: Materiales subidos por el usuario autenticado
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: estado
          in: query
          schema:
            $ref: "#/components/schemas/MaterialState"
      responses:
        "200":
          description: Listado paginado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialPage"
              example:
                materials:
                  - id: 1
                    autorId: 1
                    uploadedBy: 1
                    author: string
                    categoryId: 1
                    titulo: string
                    tipo: PDF
                    urlOrPath: string
                    portada: string
                    fileHash: string
                    descripcion: string
                    pages: 1
                    categories:
                      - string
                    estado: Pendiente
                    hasStoredFile: true
                    materias:
                      - {}
                    materiasIds:
                      - 1
                    carreras:
                      - {}
                    createdAt: 2026-01-01T00:00:00.000Z
                pagination:
                  page: 1
                  pageSize: 1
                  total: 1
                  totalPages: 1
                  hasNext: true
                  hasPrev: true
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: getApiMaterialsMine
  /api/materials/upload:
    post:
      tags:
        - Materials
      summary: Sube un archivo o registra un enlace
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - titulo
              properties:
                titulo:
                  type: string
                  maxLength: 150
                tipo:
                  $ref: "#/components/schemas/MaterialType"
                urlOrPath:
                  type: string
                  format: uri
                  description: Obligatorio cuando no se envia `archivo`
                archivo:
                  type: string
                  format: binary
                portada:
                  type: string
                  format: binary
                author:
                  type: string
                category:
                  type: string
                descripcion:
                  type: string
                pages:
                  type: integer
                  minimum: 1
                categories:
                  type: string
                  description: Lista separada por coma
                subjects:
                  type: string
                  description: IDs separados por coma
                isMandatory:
                  type: boolean
            example:
              titulo: string
              tipo: PDF
              urlOrPath: https://example.com/recurso
              author: string
              category: string
              descripcion: string
              pages: 1
              categories: string
              subjects: string
              isMandatory: true
      responses:
        "201":
          description: Material creado o sugerencia duplicada
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicate:
                    type: boolean
                  material:
                    $ref: "#/components/schemas/Material"
              example:
                duplicate: true
                material:
                  id: 1
                  autorId: 1
                  uploadedBy: 1
                  author: string
                  categoryId: 1
                  titulo: string
                  tipo: PDF
                  urlOrPath: string
                  portada: string
                  fileHash: string
                  descripcion: string
                  pages: 1
                  categories:
                    - string
                  estado: Pendiente
                  hasStoredFile: true
                  materias:
                    - {}
                  materiasIds:
                    - 1
                  carreras:
                    - {}
                  createdAt: 2026-01-01T00:00:00.000Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      operationId: postApiMaterialsUpload
  /api/materials/{id}/file:
    get:
      tags:
        - Files
      summary: Sirve el archivo para visualizacion inline
      description: |
        Los materiales aprobados son publicos. Los pendientes requieren el
        propietario, el profesor de una materia asociada o Superadmin. La cookie
        de archivos se evalua de forma perezosa solo si hace falta.
      security:
        - bearerAuth: []
        - fileCookieAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Archivo completo
          headers:
            Cache-Control:
              schema:
                type: string
        "206":
          description: Porcion del archivo solicitada con `Range`
          headers:
            Content-Range:
              schema:
                type: string
        "302":
          description: Redireccion a un enlace externo no gestionado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      operationId: getApiMaterialsIdFile
  /api/materials/{id}/download:
    get:
      tags:
        - Files
      summary: Descarga el archivo como adjunto
      security:
        - bearerAuth: []
        - fileCookieAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Archivo adjunto
          headers:
            Content-Disposition:
              schema:
                type: string
        "302":
          description: Redireccion a un enlace externo no gestionado
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      operationId: getApiMaterialsIdDownload
  /api/materials/{id}/favorite:
    post:
      tags:
        - Materials
      summary: Alterna el material en favoritos
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Estado de favorito resultante
          content:
            application/json:
              schema:
                type: object
                properties:
                  isFavorite:
                    type: boolean
                  favoritesCount:
                    type: integer
              example:
                isFavorite: true
                favoritesCount: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      operationId: postApiMaterialsIdFavorite
  /api/materials/favorites/mine:
    get:
      tags:
        - Materials
      summary: Lista los favoritos del usuario autenticado
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Favoritos paginados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/MaterialPage"
                  - type: object
                    properties:
                      favorites:
                        type: array
                        items:
                          $ref: "#/components/schemas/Material"
              example:
                materials:
                  - id: 1
                    autorId: 1
                    uploadedBy: 1
                    author: string
                    categoryId: 1
                    titulo: string
                    tipo: PDF
                    urlOrPath: string
                    portada: string
                    fileHash: string
                    descripcion: string
                    pages: 1
                    categories:
                      - string
                    estado: Pendiente
                    hasStoredFile: true
                    materias:
                      - {}
                    materiasIds:
                      - 1
                    carreras:
                      - {}
                    createdAt: 2026-01-01T00:00:00.000Z
                pagination:
                  page: 1
                  pageSize: 1
                  total: 1
                  totalPages: 1
                  hasNext: true
                  hasPrev: true
                favorites:
                  - id: 1
                    autorId: 1
                    uploadedBy: 1
                    author: string
                    categoryId: 1
                    titulo: string
                    tipo: PDF
                    urlOrPath: string
                    portada: string
                    fileHash: string
                    descripcion: string
                    pages: 1
                    categories:
                      - string
                    estado: Pendiente
                    hasStoredFile: true
                    materias:
                      - {}
                    materiasIds:
                      - 1
                    carreras:
                      - {}
                    createdAt: 2026-01-01T00:00:00.000Z
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: getApiMaterialsFavoritesMine
  /api/materials/{id}/approve:
    post:
      tags:
        - Moderation
      summary: Aprueba un material para una materia
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subjectId
              properties:
                subjectId:
                  type: integer
            example:
              subjectId: 1
      responses:
        "200":
          description: Asociacion aprobada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationResult"
              example:
                message: string
                material:
                  id: 1
                  autorId: 1
                  uploadedBy: 1
                  author: string
                  categoryId: 1
                  titulo: string
                  tipo: PDF
                  urlOrPath: string
                  portada: string
                  fileHash: string
                  descripcion: string
                  pages: 1
                  categories:
                    - string
                  estado: Pendiente
                  hasStoredFile: true
                  materias:
                    - {}
                  materiasIds:
                    - 1
                  carreras:
                    - {}
                  createdAt: 2026-01-01T00:00:00.000Z
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      operationId: postApiMaterialsIdApprove
  /api/materials/{id}/reject:
    post:
      tags:
        - Moderation
      summary: Rechaza un material para una materia
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subjectId
              properties:
                subjectId:
                  type: integer
            example:
              subjectId: 1
      responses:
        "200":
          description: Asociacion rechazada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationResult"
              example:
                message: string
                material:
                  id: 1
                  autorId: 1
                  uploadedBy: 1
                  author: string
                  categoryId: 1
                  titulo: string
                  tipo: PDF
                  urlOrPath: string
                  portada: string
                  fileHash: string
                  descripcion: string
                  pages: 1
                  categories:
                    - string
                  estado: Pendiente
                  hasStoredFile: true
                  materias:
                    - {}
                  materiasIds:
                    - 1
                  carreras:
                    - {}
                  createdAt: 2026-01-01T00:00:00.000Z
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      operationId: postApiMaterialsIdReject
  /api/materials/{id}/associate:
    post:
      tags:
        - Moderation
      summary: Asocia un material a una o mas materias del profesor
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required:
                    - subjectId
                  properties:
                    subjectId:
                      type: integer
                - type: object
                  required:
                    - subjectIds
                  properties:
                    subjectIds:
                      type: array
                      minItems: 1
                      items:
                        type: integer
            example:
              subjectId: 1
      responses:
        "200":
          description: Asociaciones creadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationResult"
              example:
                message: string
                material:
                  id: 1
                  autorId: 1
                  uploadedBy: 1
                  author: string
                  categoryId: 1
                  titulo: string
                  tipo: PDF
                  urlOrPath: string
                  portada: string
                  fileHash: string
                  descripcion: string
                  pages: 1
                  categories:
                    - string
                  estado: Pendiente
                  hasStoredFile: true
                  materias:
                    - {}
                  materiasIds:
                    - 1
                  carreras:
                    - {}
                  createdAt: 2026-01-01T00:00:00.000Z
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      operationId: postApiMaterialsIdAssociate
  /api/materials/{id}/cancel:
    post:
      tags:
        - Materials
      summary: Cancela una subida pendiente y borra sus archivos
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Subida cancelada
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      operationId: postApiMaterialsIdCancel
  /api/materials/{id}:
    delete:
      tags:
        - Moderation
      summary: Elimina un material globalmente (Superadmin)
      parameters:
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Material eliminado
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      operationId: deleteApiMaterialsId
    put:
      tags:
        - Materials
      summary: Actualiza un material
      operationId: putApiMaterialsId
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {}
      responses:
        "200":
          description: Operacion correcta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      x-generated: true
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Registra un alumno
      operationId: postApiAuthRegister
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {}
      responses:
        "200":
          description: Operacion correcta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      x-generated: true
  /api/auth/verify-account:
    post:
      tags:
        - Auth
      summary: Verifica una cuenta con codigo
      operationId: postApiAuthVerifyAccount
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {}
      responses:
        "200":
          description: Operacion correcta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      x-generated: true
    get:
      tags:
        - Auth
      summary: Verifica una cuenta con codigo por query
      operationId: getApiAuthVerifyAccount
      security: []
      responses:
        "200":
          description: Operacion correcta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}
        "400":
          $ref: "#/components/responses/BadRequest"
      x-generated: true
  /api/auth/activate:
    post:
      tags:
        - Auth
      summary: Activa una cuenta con token
      operationId: postApiAuthActivate
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {}
      responses:
        "200":
          description: Operacion correcta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      x-generated: true
  /api/auth/activate/{token}:
    get:
      tags:
        - Auth
      summary: Activa una cuenta desde el enlace del correo
      operationId: getApiAuthActivateToken
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Operacion correcta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}
        "400":
          $ref: "#/components/responses/BadRequest"
      x-generated: true
  /api/auth/resend-verification:
    post:
      tags:
        - Auth
      summary: Reenvia el codigo de verificacion
      operationId: postApiAuthResendVerification
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {}
      responses:
        "200":
          description: Operacion correcta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      x-generated: true
  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Cierra la sesion y elimina la cookie de archivos
      operationId: postApiAuthLogout
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {}
      responses:
        "200":
          description: Operacion correcta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      x-generated: true
  /api/auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Solicita el reseteo de clave
      operationId: postApiAuthForgotPassword
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example: {}
      responses:
        "200":
          description: Operacion correcta
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
      x-generated: true
  /api/auth/reset-password/{token}/validate:
    get:
      tags:
        - Auth
      summary: Valida un token de reseteo
      operationId: getApiAuthResetPasswordTokenValidate
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
