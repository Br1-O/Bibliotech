<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2ff">
    <script src="/js/theme.js"></script>
    <title>Bibliotech · Recuperar contrasena</title>
    <link rel="stylesheet" href="/css/shared/variables.css">
    <link rel="stylesheet" href="/css/shared/base.css">
    <link rel="stylesheet" href="/css/shared/forms.css">
    <link rel="stylesheet" href="/css/components/passwordField/passwordField.css">
    <link rel="stylesheet" href="/css/shared/badges.css">
    <link rel="stylesheet" href="/css/components/button/button.css">
    <link rel="stylesheet" href="/css/components/cards/cards.css">
    <link rel="stylesheet" href="/css/components/pagination/pagination.css">
    <link rel="stylesheet" href="/css/components/navbar/navbar.css">
    <link rel="stylesheet" href="/css/components/loader/loader.css">
    <link rel="stylesheet" href="/css/components/modal/modal.css">
    <link rel="stylesheet" href="/css/components/materialEditor/materialEditor.css">
    <link rel="stylesheet" href="/css/components/materialViewer/materialViewer.css">
    <link rel="stylesheet" href="/css/components/toast/toast.css">
    <link rel="stylesheet" href="/css/components/table/table.css">
    <link rel="stylesheet" href="/css/components/tagInput/tagInput.css">
    <link rel="stylesheet" href="/css/components/careers/careers.css">
    <link rel="stylesheet" href="/css/components/profileSummary/profileSummary.css">
    <link rel="stylesheet" href="/css/components/contentTabs/contentTabs.css">
    <link rel="stylesheet" href="/css/components/passwordChange/passwordChange.css">
    <link rel="stylesheet" href="/css/shared/utilities.css">
    <link rel="stylesheet" href="/css/pages/auth.css">
</head>
<body>
    <div id="btPageLoader" class="bt-page-loader" role="status" aria-live="polite" aria-label="Cargando...">
        <span class="bt-page-loader__mark" aria-hidden="true">B</span>
        <span class="bt-page-loader__label">Bibliotech</span>
    </div>
    <bt-navbar></bt-navbar>

    <main class="bt-auth">
        <div class="bt-auth__card bt-stack">
            <div class="bt-auth__brand">
                <h1 data-i18n="auth.forgotTitle">Recuperar contrasena</h1>
                <p class="bt-text-muted" data-i18n="auth.forgotSubtitle">Te enviaremos un enlace para restablecerla</p>
            </div>

            <form id="forgotForm" class="bt-stack" novalidate>
                <div class="bt-field">
                    <label class="bt-label" for="forgotEmail" data-i18n="auth.email">Correo electronico</label>
                    <input id="forgotEmail" class="bt-input" type="email" name="email" autocomplete="email">
                    <span class="bt-error-text" data-error-for="email"></span>
                </div>

                <bt-button type="submit" block label-i18n="auth.sendLink"></bt-button>
            </form>

            <p class="bt-auth__help">
                <a href="/login" data-i18n="auth.backToLogin">Volver al inicio de sesion</a>
            </p>
        </div>
    </main>

    <script src="/js/utils/dom.js"></script>
    <script src="/js/i18n/LanguageManager.js"></script>
    <script src="/js/utils/authHelper.js"></script>
    <script src="/js/utils/validator.js"></script>
    <script src="/js/components/icons/icons.js"></script>
    <script src="/js/components/passwordField/passwordField.js"></script>
    <script src="/js/components/button/button.js"></script>
    <script src="/js/components/loader/loader.js"></script>
    <script src="/js/components/toast/toast.js"></script>
    <script src="/js/components/modal/modal.js"></script>
    <script src="/js/components/cards/cards.js"></script>
    <script src="/js/components/passwordChange/passwordChange.js"></script>
    <script src="/js/components/navbar/navbar.js"></script>
    <script src="/js/services/apiService.js"></script>
    <script src="/js/frontControllers/authFrontController.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
