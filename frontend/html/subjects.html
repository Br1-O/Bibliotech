<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2ff">
    <script src="/js/theme.js"></script>
    <title>Bibliotech · Materias</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
    <div id="btPageLoader" class="bt-page-loader" role="status" aria-live="polite" aria-label="Cargando...">
        <span class="bt-page-loader__mark" aria-hidden="true">B</span>
        <span class="bt-page-loader__label">Bibliotech</span>
    </div>
    <bt-navbar active="subjects"></bt-navbar>

    <main class="bt-page">
        <section class="bt-hero bt-container">
            <h1 data-i18n="subjects.pageTitle">Carreras y materias</h1>
            <p data-i18n="subjects.pageSubtitle">Explora las carreras, sus anios y las materias disponibles.</p>
        </section>

        <section id="carreras" class="bt-container bt-stack bt-mt-6">
            <div class="bt-row bt-between bt-wrap" style="gap: var(--space-3)">
                <div>
                    <h2 data-i18n="careers.title">Carreras</h2>
                    <p class="bt-text-muted" data-i18n="careers.subtitle">Elige una carrera y un anio para explorar sus materias.</p>
                </div>
                <button id="careerClear" class="bt-btn bt-btn--ghost bt-hidden" type="button"
                        data-i18n="careers.allCareers">Ver todas las carreras</button>
            </div>
            <div id="careersGrid" class="bt-career-strip"></div>
            <div id="careerYears" class="bt-row bt-wrap"></div>
        </section>

        <section id="materias" class="bt-container bt-stack bt-mt-6">
            <div class="bt-row bt-between bt-wrap" style="gap: var(--space-3)">
                <div>
                    <h2 data-i18n="subjects.title">Materias</h2>
                    <p class="bt-text-muted" data-i18n="subjects.subtitle">Explora las materias disponibles y suscribete.</p>
                </div>
                <div class="bt-row bt-wrap" style="gap: var(--space-2)">
                    <div id="careerAllSubjectsWrap" class="bt-hidden">
                        <bt-button id="careerAllSubjectsBtn" size="sm" variant="ghost" label-i18n="careers.seeAllSubjects"></bt-button>
                    </div>
                    <div id="professorFilterWrap" class="bt-hidden">
                        <bt-button id="professorFilterBtn" size="sm" variant="secondary" label-i18n="subjects.onlyMine"></bt-button>
                    </div>
                    <div id="subscribedToggleWrap" class="bt-hidden">
                        <bt-button id="toggleSubscribedBtn" size="sm" variant="secondary" label-i18n="subjects.onlySubscribed"></bt-button>
                    </div>
                </div>
            </div>
            <div id="subjectsGrid" class="bt-grid"></div>
            <div id="subjectsPagination"></div>
        </section>

        <section id="suscritas" class="bt-container bt-stack bt-mt-6 bt-hidden">
            <div>
                <h2 data-i18n="subjects.mySubscriptionsTitle">Mis materias suscritas</h2>
                <p class="bt-text-muted" data-i18n="subjects.mySubscriptionsSubtitle">Accede rapido al material de las materias que sigues.</p>
            </div>
            <div id="subscribedGrid" class="bt-grid"></div>
            <div id="subscribedPagination"></div>
        </section>
    </main>

    <script src="/js/utils/dom.js"></script>
    <script src="/js/i18n/LanguageManager.js"></script>
    <script src="/js/utils/authHelper.js"></script>
    <script src="/js/components/icons.js"></script>
    <script src="/js/components/button.js"></script>
    <script src="/js/components/loader.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/components/cards.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/components/pagination.js"></script>
    <script src="/js/services/apiService.js"></script>
    <script src="/js/frontControllers/subjectsFrontController.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
