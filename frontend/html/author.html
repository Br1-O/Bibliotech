<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2ff">
    <script src="/js/theme.js"></script>
    <title>Bibliotech · Autor</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
    <div id="btPageLoader" class="bt-page-loader" role="status" aria-live="polite" aria-label="Cargando...">
        <span class="bt-page-loader__mark" aria-hidden="true">B</span>
        <span class="bt-page-loader__label">Bibliotech</span>
    </div>
    <bt-navbar active="catalog"></bt-navbar>

    <main class="bt-page bt-container bt-stack">
        <section id="authorHeader" class="bt-headline bt-stack"></section>

        <section class="bt-stack">
            <h2 data-i18n="author.materials">Materiales publicados</h2>
            <div class="bt-toolbar bt-row">
                <input id="authorSearch" class="bt-input" type="search"
                       data-i18n-placeholder="catalog.searchPlaceholder" placeholder="Buscar...">
                <select id="authorTypeFilter" class="bt-select"></select>
                <button id="authorClear" class="bt-btn bt-btn--ghost" type="button"
                        data-i18n="filters.clear">Limpiar filtros</button>
            </div>
            <p id="authorResults" class="bt-text-muted"></p>
            <div id="authorMaterials" class="bt-grid"></div>
            <div id="authorPagination"></div>
        </section>
    </main>

    <script src="/js/utils/dom.js"></script>
    <script src="/js/i18n/LanguageManager.js"></script>
    <script src="/js/utils/authHelper.js"></script>
    <script src="/js/utils/validator.js"></script>
    <script src="/js/components/icons.js"></script>
    <script src="/js/components/passwordField.js"></script>
    <script src="/js/components/button.js"></script>
    <script src="/js/components/loader.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/components/materialViewer.js"></script>
    <script src="/js/components/cards.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/components/pagination.js"></script>
    <script src="/js/services/apiService.js"></script>
    <script src="/js/frontControllers/authorFrontController.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
