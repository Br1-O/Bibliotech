<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2ff">
    <script src="/js/theme.js"></script>
    <title>Bibliotech · Panel del profesor</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
    <div id="btPageLoader" class="bt-page-loader" role="status" aria-live="polite" aria-label="Cargando...">
        <span class="bt-page-loader__mark" aria-hidden="true">B</span>
        <span class="bt-page-loader__label">Bibliotech</span>
    </div>
    <bt-navbar active="panel"></bt-navbar>

    <main id="teacherDashboard" class="bt-page bt-container bt-stack">
        <h1 data-i18n="teacher.panelTitle">Panel del profesor</h1>

        <section class="bt-panel bt-stack">
            <h2 data-i18n="teacher.uploadMaterial">Subir material</h2>
            <form id="teacherMaterialForm" class="bt-stack" novalidate>
                <div class="bt-field">
                    <label class="bt-label" for="tTitulo" data-i18n="material.title">Titulo</label>
                    <input id="tTitulo" class="bt-input" type="text" name="titulo">
                    <span class="bt-error-text" data-error-for="titulo"></span>
                </div>

                <div class="bt-field">
                    <label class="bt-label" for="tTipo" data-i18n="material.type">Tipo</label>
                    <select id="tTipo" class="bt-select" name="tipo">
                        <option value="PDF" data-i18n="material.types.PDF">PDF</option>
                        <option value="EPUB" data-i18n="material.types.EPUB">EPUB</option>
                        <option value="Word" data-i18n="material.types.Word">Word</option>
                        <option value="Presentacion" data-i18n="material.types.Presentacion">Presentacion</option>
                        <option value="Link_Drive" data-i18n="material.types.Link_Drive">Enlace de Drive</option>
                        <option value="Youtube" data-i18n="material.types.Youtube">Video de YouTube</option>
                        <option value="Repositorio" data-i18n="material.types.Repositorio">Repositorio GitHub</option>
                    </select>
                </div>

                <div class="bt-field" data-mode="file">
                    <label class="bt-label" for="tArchivo" data-i18n="material.file">Archivo</label>
                    <input id="tArchivo" class="bt-input" type="file" name="archivo">
                </div>

                <div class="bt-field bt-hidden" data-mode="link">
                    <label class="bt-label" for="tUrl" data-i18n="material.link">Enlace</label>
                    <input id="tUrl" class="bt-input" type="url" name="urlOrPath"
                           data-i18n-placeholder="material.linkPlaceholder" placeholder="https://...">
                </div>

                <div class="bt-field">
                    <label class="bt-label" for="tPortada" data-i18n="material.cover">Imagen de portada</label>
                    <input id="tPortada" class="bt-input" type="file" name="portada" accept="image/*">
                </div>

                <div class="bt-field">
                    <label class="bt-label" for="tDesc" data-i18n="material.description">Descripcion</label>
                    <textarea id="tDesc" class="bt-textarea" name="descripcion" rows="3"
                              data-i18n-placeholder="material.descriptionPlaceholder" placeholder="Breve descripcion del material"></textarea>
                </div>

                <div class="bt-field">
                    <label class="bt-label" for="teacherMaterialSubjects" data-i18n="material.subjects">Materias de destino</label>
                    <select id="teacherMaterialSubjects" class="bt-select" multiple size="4"></select>
                    <span class="bt-error-text" data-error-for="subjects"></span>
                </div>

                <div class="bt-field">
                    <label class="bt-label" for="tTags" data-i18n="material.tags">Etiquetas tematicas</label>
                    <input id="tTags" class="bt-input" type="text" name="categories"
                           data-i18n-placeholder="material.tagsPlaceholder" placeholder="matematica, algebra">
                </div>

                <bt-button type="submit" block label-i18n="material.publish"></bt-button>
            </form>
        </section>

        <section class="bt-stack">
            <h2 data-i18n="teacher.pendingReview">Material por revisar</h2>
            <div id="pendingReview" class="bt-grid"></div>
        </section>

        <section class="bt-stack">
            <h2 data-i18n="myUploads.title">Mis subidas</h2>
            <p class="bt-text-muted" data-i18n="myUploads.hint">Material subido por ti, con busqueda, filtros y edicion.</p>
            <div id="myUploads"></div>
        </section>

        <section class="bt-stack">
            <h2 data-i18n="teacher.mySubjects">Mis materias</h2>
            <div id="mySubjects" class="bt-grid"></div>
            <div id="mySubjectsPagination"></div>
            <div id="observerPanel" class="bt-stack bt-mt-4"></div>
        </section>
    </main>

    <script src="/js/utils/dom.js"></script>
    <script src="/js/i18n/LanguageManager.js"></script>
    <script src="/js/utils/authHelper.js"></script>
    <script src="/js/utils/validator.js"></script>
    <script src="/js/components/icons.js"></script>
    <script src="/js/components/passwordField.js"></script>
    <script src="/js/components/button.js"></script>
    <script src="/js/components/loader.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/components/materialViewer.js"></script>
    <script src="/js/components/tagInput.js"></script>
    <script src="/js/components/cards.js"></script>
    <script src="/js/components/materialEditor.js"></script>
    <script src="/js/components/myUploads.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/components/pagination.js"></script>
    <script src="/js/services/apiService.js"></script>
    <script src="/js/frontControllers/teacherDashboardFrontController.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
