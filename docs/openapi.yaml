            application/pdf:
              schema:
                type: string
                format: binary
              example: PDF
        "404": *a1
  /api/documentation/adr:
    get:
      tags:
        - Documentation
      summary: Indice de decisiones de arquitectura
      operationId: getApiDocumentationAdr
      security: []
      responses:
        "200":
          description: Documentacion HTML publica
          content:
            text/html:
              schema:
                type: string
              example:
                <!doctype html><html lang="es"><head><title>Decisiones de arquitectura
                - Bibliotech</title></head><body><h1>Decisiones de
                arquitectura</h1></body></html>
        "404": &a2
          $ref: "#/components/responses/NotFound"
  /api/documentation/adr/{file}:
    get:
      tags:
        - Documentation
      summary: Architecture Decision Record
      operationId: getApiDocumentationAdrFile
      security: []
      parameters:
        - name: file
          in: path
          required: true
          description: Archivo Markdown de ADR permitido
          schema:
            type: string
            pattern: ^[0-9]{4}-[a-z0-9-]+\.md$
      responses:
        "200":
          description: ADR renderizado como HTML
          content:
            text/html:
              schema:
                type: string
              example:
                <!doctype html><html lang="es"><head><title>Architecture Decision
                Record - Bibliotech</title></head><body><h1>Architecture
                Decision Record</h1></body></html>
        "404": *a2
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    fileCookieAuth:
      type: apiKey
      in: cookie
      name: bibliotech_file_token
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Tamano de pagina (1-100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    MaterialId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    MaterialType:
      type: string
      enum:
        - PDF
        - EPUB
        - Word
        - Presentacion
        - Youtube
        - Enlace
    MaterialState:
      type: string
      enum:
        - Pendiente
        - Aprobado
        - Rechazado
        - Cancelado
    Material:
      type: object
      properties:
        id:
          type: integer
        autorId:
          type: integer
        uploadedBy:
          type: integer
          nullable: true
        author:
          type: string
          nullable: true
        categoryId:
          type: integer
          nullable: true
        titulo:
          type: string
        tipo:
          $ref: "#/components/schemas/MaterialType"
        urlOrPath:
          type: string
          nullable: true
          description: Null para archivos almacenados en Cloudinary
        portada:
          type: string
          nullable: true
        fileHash:
          type: string
        descripcion:
          type: string
          nullable: true
        pages:
          type: integer
          nullable: true
        categories:
          type: array
          items:
            type: string
        estado:
          $ref: "#/components/schemas/MaterialState"
        hasStoredFile:
          type: boolean
        materias:
          type: array
          items:
            type: object
            additionalProperties: true
        materiasIds:
          type: array
          items:
            type: integer
        carreras:
          type: array
          items:
            type: object
            additionalProperties: true
        createdAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
          format: email
        rol:
          type: string
        estado:
          type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean
    MaterialPage:
      type: object
      required:
        - materials
        - pagination
      properties:
        materials:
          type: array
          items:
            $ref: "#/components/schemas/Material"
        pagination:
          $ref: "#/components/schemas/Pagination"
    ModerationResult:
      type: object
      additionalProperties: true
      properties:
        message:
          type: string
        material:
          $ref: "#/components/schemas/Material"
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        code:
          type: string
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
        fields:
          type: object
          additionalProperties: true
        requestId:
          type: string
          nullable: true
  responses:
    BadRequest:
      description: Solicitud invalida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: string
            code: string
            errors:
              - {}
            fields: {}
            requestId: string
    Unauthorized:
      description: Falta autenticacion o el token es invalido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: string
            code: string
            errors:
              - {}
            fields: {}
            requestId: string
    Forbidden:
      description: El usuario no puede realizar la operacion
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: string
            code: string
            errors:
              - {}
            fields: {}
            requestId: string
    NotFound:
      description: Recurso inexistente
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: string
            code: string
            errors:
              - {}
            fields: {}
            requestId: string
    Conflict:
      description: Conflicto con el estado actual del recurso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: string
            code: string
            errors:
              - {}
            fields: {}
            requestId: string
    PayloadTooLarge:
      description: Archivo o formulario demasiado grande
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: string
            code: string
            errors:
              - {}
            fields: {}
            requestId: string
    UnprocessableEntity:
      description: Datos o archivo no validos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: string
            code: string
            errors:
              - {}
            fields: {}
            requestId: string
    TooManyRequests:
      description: Limite de peticiones excedido
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: string
            code: string
            errors:
              - {}
            fields: {}
            requestId: string
