<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f2ff">
    <script src="/js/theme.js"></script>
    <title>Bibliotech · Ingresar</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
    <div id="btPageLoader" class="bt-page-loader" role="status" aria-live="polite" aria-label="Cargando...">
        <span class="bt-page-loader__mark" aria-hidden="true">B</span>
        <span class="bt-page-loader__label">Bibliotech</span>
    </div>
    <bt-navbar></bt-navbar>

    <main class="bt-auth">
        <div class="bt-auth__card bt-stack">
            <div class="bt-auth__brand">
                <h1 data-i18n="auth.loginTitle">Inicia sesion</h1>
                <p class="bt-text-muted" data-i18n="auth.loginSubtitle">Accede a tu aula virtual</p>
            </div>

            <form id="loginForm" class="bt-stack" novalidate>
                <div class="bt-field">
                    <label class="bt-label" for="loginEmail" data-i18n="auth.email">Correo electronico</label>
                    <input id="loginEmail" class="bt-input" type="email" name="email" autocomplete="email">
                    <span class="bt-error-text" data-error-for="email"></span>
                </div>

                <div class="bt-field">
                    <label class="bt-label" for="loginPassword" data-i18n="auth.password">Contrasena</label>
                    <input id="loginPassword" class="bt-input" type="password" name="password" autocomplete="current-password">
                    <span class="bt-error-text" data-error-for="password"></span>
                </div>

                <div id="loginAlert" class="bt-form-alert" role="alert"></div>
                <bt-button type="submit" block label-i18n="auth.loginButton"></bt-button>
            </form>

            <p class="bt-auth__help">
                <a href="/forgot-password" data-i18n="auth.forgotPassword">Olvide mi contrasena</a>
            </p>
            <p class="bt-auth__help">
                <span data-i18n="auth.noAccount">Aun no tienes cuenta?</span>
                <a href="/register" data-i18n="auth.registerButton">CREAR CUENTA</a>
            </p>
            <p class="bt-auth__help bt-text-muted" data-i18n="auth.demoHint"></p>
        </div>
    </main>

    <script src="/js/utils/dom.js"></script>
    <script src="/js/i18n/LanguageManager.js"></script>
    <script src="/js/utils/authHelper.js"></script>
    <script src="/js/utils/validator.js"></script>
    <script src="/js/components/icons.js"></script>
    <script src="/js/components/passwordField.js"></script>
    <script src="/js/components/button.js"></script>
    <script src="/js/components/loader.js"></script>
    <script src="/js/components/toast.js"></script>
    <script src="/js/components/modal.js"></script>
    <script src="/js/components/cards.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/services/apiService.js"></script>
    <script src="/js/frontControllers/authFrontController.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
